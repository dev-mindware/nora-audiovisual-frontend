<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nora Audiovisual — Catálogo Oficial de Templates de Email (38 Modelos • AO1945)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-bg: #090d16;
      --app-surface: #0f172a;
      --app-border: #1e293b;
      --app-text: #f8fafc;
      --app-muted: #94a3b8;
      --primary: #0284c7;
      --primary-light: rgba(2, 132, 199, 0.15);
      --accent-ai: #8b5cf6;
      --accent-auto: #d97706;
      --success: #10b981;
      --danger: #ef4444;

      /* Variáveis de Tema do Email (Default: Light) */
      --em-bg: #ffffff;
      --em-text: #0f172a;
      --em-muted: #64748b;
      --em-border: #e2e8f0;
      --em-card-bg: #f8fafc;
      --em-row-border: #f1f5f9;
      --em-footer-bg: #f8fafc;
      --em-footer-border: #e2e8f0;
    }

    /* Tema Escuro para o Email */
    body.em-dark-theme {
      --em-bg: #0b1120;
      --em-text: #f8fafc;
      --em-muted: #94a3b8;
      --em-border: #1e293b;
      --em-card-bg: #0f172a;
      --em-row-border: #1e293b;
      --em-footer-bg: #070c18;
      --em-footer-border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important; /* Identidade Nora: cantos estritamente retos */
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--app-bg);
      color: var(--app-text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar */
    .sidebar {
      width: 380px;
      background-color: var(--app-surface);
      border-right: 1px solid var(--app-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--app-border);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(2, 132, 199, 0.3);
    }

    .search-box {
      margin-top: 12px;
    }

    .search-input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--app-border);
      color: #fff;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .category-filter {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 16px;
      border-bottom: 1px solid var(--app-border);
      scrollbar-width: none;
    }
    .category-filter::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: transparent;
      border: 1px solid var(--app-border);
      color: var(--app-muted);
      font-size: 11px;
      padding: 4px 8px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--app-border);
      color: #fff;
    }

    .template-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .template-item {
      padding: 10px 12px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.15s;
      margin-bottom: 4px;
      text-align: left;
      width: 100%;
    }

    .template-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--app-border);
    }

    .template-item.active {
      background: rgba(2, 132, 199, 0.08);
      border-color: var(--primary);
    }

    .template-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .template-item-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .template-item-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--app-muted);
    }

    .badge {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 1px 5px;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
    }

    .badge-billing { background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }
    .badge-finance { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; border-color: rgba(14, 165, 233, 0.3); }
    .badge-trial { background: rgba(2, 132, 199, 0.15); color: #38bdf8; border-color: rgba(2, 132, 199, 0.3); }
    .badge-budget { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
    .badge-automate { background: rgba(217, 119, 6, 0.15); color: #f59e0b; border-color: rgba(217, 119, 6, 0.3); }
    .badge-ai { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border-color: rgba(139, 92, 246, 0.3); }
    .badge-prod { background: rgba(236, 72, 153, 0.15); color: #f472b6; border-color: rgba(236, 72, 153, 0.3); }
    .badge-security { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

    /* Main Preview Container */
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #020617;
      overflow: hidden;
    }

    .preview-header {
      padding: 12px 24px;
      background: var(--app-surface);
      border-bottom: 1px solid var(--app-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .meta-subject {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--app-muted);
    }

    .meta-info-item strong {
      color: #cbd5e1;
      font-weight: 600;
    }

    .view-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-group {
      display: flex;
      border: 1px solid var(--app-border);
    }

    .view-btn {
      background: #090d16;
      border: none;
      color: var(--app-muted);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .view-btn:hover {
      color: #fff;
    }

    .view-btn.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .preview-body {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
    }

    .email-frame-container {
      transition: width 0.25s ease;
      background: var(--em-bg);
      color: var(--em-text);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      height: fit-content;
      border: 1px solid var(--em-border);
    }

    .frame-desktop {
      width: 620px;
    }

    .frame-mobile {
      width: 375px;
    }

    /* ============================================================
       DESIGN SYSTEM NORA AUDIOVISUAL — EMAIL TEMPLATES (AO1945)
       ============================================================ */
    .em-wrap {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 28px 24px;
      line-height: 1.55;
      color: var(--em-text);
      background: var(--em-bg);
    }

    /* Cabeçalho do Email com Contexto Dinâmico da Organização e Plano */
    .em-header {
      border-bottom: 1px solid var(--em-border);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .em-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .em-brand-combo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .em-logo {
      display: flex;
      align-items: center;
    }

    .em-logo-dark { display: none !important; }
    .em-logo-light { display: block !important; }

    body.em-dark-theme .em-logo-dark { display: block !important; }
    body.em-dark-theme .em-logo-light { display: none !important; }

    .em-brand-sep {
      width: 1px;
      height: 22px;
      background: var(--em-border);
    }

    .em-org-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .em-org-emblem {
      width: 24px;
      height: 24px;
      background: #0284c7;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .em-org-info {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .em-org-name {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--em-text);
    }

    .em-org-sub {
      font-size: 9px;
      color: var(--em-muted);
    }

    .em-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      background: var(--em-card-bg);
      color: var(--em-muted);
      border: 1px solid var(--em-border);
    }

    /* Context Bar Dinâmica: Plano e Add-ons */
    .em-context-bar {
      margin-top: 10px;
      padding: 6px 10px;
      background: var(--em-card-bg);
      border: 1px solid var(--em-border);
      font-size: 10.5px;
      color: var(--em-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .em-context-bar strong {
      color: var(--em-text);
      font-weight: 600;
    }

    .em-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--em-text);
      line-height: 1.35;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .em-intro {
      font-size: 13.5px;
      color: var(--em-muted);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .em-intro strong {
      color: var(--em-text);
      font-weight: 600;
    }

    .em-card {
      background: var(--em-card-bg);
      border-left: 3px solid var(--primary);
      border-top: 1px solid var(--em-border);
      border-right: 1px solid var(--em-border);
      border-bottom: 1px solid var(--em-border);
      padding: 14px 16px;
      margin: 18px 0;
    }

    .em-card.danger {
      border-left-color: var(--danger);
    }

    .em-card.success {
      border-left-color: var(--success);
    }

    .em-card.warning {
      border-left-color: var(--accent-auto);
    }

    .em-card.ai {
      border-left-color: var(--accent-ai);
    }

    .em-card.finance {
      border-left-color: #0ea5e9;
    }

    .em-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
      border-bottom: 1px solid var(--em-row-border);
    }
    .em-row:last-child {
      border-bottom: none;
    }

    .em-row-label {
      color: var(--em-muted);
      font-weight: 500;
    }

    .em-row-value {
      color: var(--em-text);
      font-weight: 600;
      text-align: right;
    }

    .em-code-box {
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 10px;
      margin: 12px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #38bdf8;
    }

    .em-btn {
      display: inline-block;
      background: var(--primary);
      color: #ffffff !important;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 20px;
      margin-top: 16px;
      letter-spacing: -0.01em;
      text-align: center;
      border: none;
      transition: opacity 0.15s;
    }

    .em-btn:hover {
      opacity: 0.9;
    }

    .em-btn.dark {
      background: #0f172a;
    }

    .em-btn.danger {
      background: var(--danger);
    }

    .em-btn.ai {
      background: var(--accent-ai);
    }

    .em-btn.auto {
      background: var(--accent-auto);
    }

    /* Rodapé Corporativo Padrão Oficial Nora Audiovisual */
    .em-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--em-footer-border);
      background: var(--em-footer-bg);
      padding: 16px;
      font-size: 11px;
      color: var(--em-muted);
      line-height: 1.55;
    }

    .em-footer-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--em-text);
    }

    .em-footer-links {
      display: flex;
      gap: 12px;
      margin: 8px 0;
      font-size: 10.5px;
    }

    .em-footer-links a {
      color: var(--primary);
      text-decoration: none;
    }

    .em-footer-links a:hover {
      text-decoration: underline;
    }

    .em-footer-legal {
      font-size: 10px;
      color: var(--em-muted);
      margin-top: 8px;
      line-height: 1.4;
      border-top: 1px dashed var(--em-border);
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">
        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="/logo-dark.png" alt="Nora Audiovisual" onerror="this.onerror=null; this.src='./logo-dark.png';" style="height: 24px; width: auto; max-width: 160px; object-fit: contain;">
        </div>
        <span class="brand-badge">38 Modelos • AO1945</span>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por assunto, código, módulo...">
      </div>
    </div>

    <div class="category-filter" id="categoryFilter">
      <button class="cat-btn active" data-cat="ALL">Todos (38)</button>
      <button class="cat-btn" data-cat="TRIAL">Trial & Subscrição</button>
      <button class="cat-btn" data-cat="BILLING">Cobrança & Fiscal AGT</button>
      <button class="cat-btn" data-cat="FINANCE">Finanças & Despesas</button>
      <button class="cat-btn" data-cat="BUDGET">Orçamentos</button>
      <button class="cat-btn" data-cat="AUTOMATE">Nora Automate</button>
      <button class="cat-btn" data-cat="AI">Nora AI</button>
      <button class="cat-btn" data-cat="PROD">Produção & Estúdio</button>
      <button class="cat-btn" data-cat="SECURITY">Segurança & Acessos</button>
    </div>

    <div class="template-list" id="templateList">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </aside>

  <!-- Painel de Preview -->
  <main class="preview-pane">
    <header class="preview-header">
      <div class="meta-details">
        <div class="meta-subject" id="previewSubject">Selecione um modelo de notificação</div>
        <div class="meta-info-row">
          <div class="meta-info-item">ID: <strong id="previewCode">-</strong></div>
          <div class="meta-info-item">Destinatário: <strong id="previewRecipient">-</strong></div>
          <div class="meta-info-item">Gatilho: <strong id="previewTrigger">-</strong></div>
        </div>
      </div>

      <div class="view-controls">
        <!-- Alternador Dark / Light -->
        <div class="ctrl-group">
          <button class="view-btn active" id="btnThemeLight" onclick="setThemeMode('light')">Modo Claro</button>
          <button class="view-btn" id="btnThemeDark" onclick="setThemeMode('dark')">Modo Escuro</button>
        </div>

        <!-- Alternador Viewport -->
        <div class="ctrl-group">
          <button class="view-btn active" id="btnDesktop" onclick="setViewMode('desktop')">Desktop (620px)</button>
          <button class="view-btn" id="btnMobile" onclick="setViewMode('mobile')">Mobile (375px)</button>
        </div>
      </div>
    </header>

    <div class="preview-body">
      <div class="email-frame-container frame-desktop" id="emailContainer">
        <!-- Renderização do HTML do Email -->
      </div>
    </div>
  </main>

  <script>
    // Catálogo Oficial dos 38 Templates (Norma Ortográfica AO1945 de Angola, font-semibold no máximo)
    const TEMPLATES = [
      // ─────────────────────────────────────────────────────────────
      // GRUPO A: TRIAL, SUBSCRIÇÃO & CICLO DE VIDA (6)
      // ─────────────────────────────────────────────────────────────
      {
        id: "TRIAL_WELCOME",
        category: "TRIAL",
        title: "Boas-vindas ao Período de Testes (Plano Inicial)",
        code: "trial.welcome",
        subject: "Bem-vindo ao Nora Audiovisual — O estúdio digital da {{orgName}} está configurado",
        recipient: "Responsável da Produtora",
        trigger: "Após registo inicial e criação da organização",
        html: `
          <h1 class="em-title">O seu estúdio operacional está configurado</h1>
          <p class="em-intro">Olá <strong>{{userName}}</strong>, seja bem-vindo à plataforma Nora Audiovisual. Durante os próximos 14 dias tem acesso completo aos recursos essenciais para estruturar a produção da sua equipa.</p>
          <div class="em-card">
            <div class="em-row"><span class="em-row-label">Organização Registada</span><span class="em-row-value">{{orgName}}</span></div>
            <div class="em-row"><span class="em-row-label">Capacidade Inicial</span><span class="em-row-value">5 Projectos • 3 Membros • 50 GB</span></div>
            <div class="em-row"><span class="em-row-label">Término da Avaliação</span><span class="em-row-value">{{trialEndsDate}}</span></div>
          </div>
          <p class="em-intro">Comece por registar o inventário de câmaras e objectivas da sua produtora ou crie a sua primeira folha de chamada (Call Sheet) para organizar a equipa técnica.</p>
          <a href="{{dashboardUrl}}" class="em-btn">Aceder ao Painel Operacional</a>
        `
      },
      {
        id: "TRIAL_MIDPOINT",
        category: "TRIAL",
        title: "Acompanhamento a Meio do Período de Testes (Dia 7)",
        code: "trial.midpoint",
        subject: "Como estão as produções da {{orgName}}? Recomendações para a sua equipa",
        recipient: "Responsável da Produtora",
        trigger: "7 dias após o início do Trial",
        html: `
          <h1 class="em-title">A meio caminho do teste: tire o máximo partido</h1>
          <p class="em-intro">Olá <strong>{{userName}}</strong>, já passaram 7 dias desde que configurou a <strong>{{orgName}}</strong>. Já experimentou o Portal de Clientes para aprovação de copiões e entrega de fotografias?</p>
          <div class="em-card warning">
            <div class="em-row"><span class="em-row-label">Projectos em Produção</span><span class="em-row-value">{{activeProjectsCount}} activos</span></div>
            <div class="em-row"><span class="em-row-label">Armazenamento Ocupado</span><span class="em-row-value">{{storageUsedGb}} GB de 50 GB</span></div>
            <div class="em-row"><span class="em-row-label">Tempo Restante de Teste</span><span class="em-row-value">7 dias</span></div>
          </div>
          <p class="em-intro">Sabia que o <strong>Plano Profissional</strong> permite até 20 projectos em simultâneo, 250 GB de armazenamento e relatórios financeiros automáticos com o Mindgest?</p>
          <a href="{{upgradeUrl}}" class="em-btn">Consultar Planos e Fazer Upgrade</a>
        `
      },
      {
        id: "TRIAL_EXPIRING_3DAYS",
        category: "TRIAL",
        title: "Aviso de Avaliação a Terminar em 3 Dias",
        code: "trial.expiring.3days",
        subject: "Faltam 3 dias para o término do período de avaliação da {{orgName}}",
        recipient: "Responsável da Produtora",
        trigger: "72 horas antes de trialEndsAt",
        html: `
          <h1 class="em-title">Mantenha os fluxos de trabalho da sua produtora activos</h1>
          <p class="em-intro">Olá <strong>{{userName}}</strong>, a subscrição de avaliação da <strong>{{orgName}}</strong> termina em 3 dias ({{trialEndsDate}}). Após esta data, a conta transitará para modo de leitura.</p>
          <div class="em-card danger">
            <div class="em-row"><span class="em-row-label">Data Limite de Avaliação</span><span class="em-row-value">{{trialEndsDate}} às 23:59</span></div>
            <div class="em-row"><span class="em-row-label">Equipa Convocada</span><span class="em-row-value">{{membersCount}} profissionais</span></div>
            <div class="em-row"><span class="em-row-label">Ficheiros e Entregáveis</span><span class="em-row-value">Permanecem integralmente guardados</span></div>
          </div>
          <p class="em-intro">Evite que a equipa técnica fique impedida de emitir orçamentos e novas folhas de rodagem. Regularize a subscrição com pagamento mensal ou anual com desconto.</p>
          <a href="{{upgradeUrl}}" class="em-btn danger">Garantir Continuidade do Plano</a>
        `
      },
      {
        id: "TRIAL_EXPIRING_24H",

    // Construtor do Cabeçalho Padrão com Logotipo e Co-Branding

      return `
        <div class="em-header">

            <div class="em-brand-combo">
              <!-- Logotipo Oficial Nora Audiovisual -->
              <div class="em-logo">

                </div>
              </div>
            </div>
            <div class="em-tag">${categoryTag}</div>
          </div>
        </div>
      `;
    }

    function interpolate(text, vars) {
      let res = text;
      for (const [k, v] of Object.entries(vars)) {
        res = res.replaceAll(`{{${k}}}`, v);
      }
      return res;
    }

    function renderList() {
      const listEl = document.getElementById("templateList");
      listEl.innerHTML = "";

      const filtered = TEMPLATES.filter(t => {
        const matchesCat = currentCategory === "ALL" || t.category === currentCategory;
        const matchesSearch = searchQuery === "" || 
          t.title.toLowerCase().includes(searchQuery) ||
          t.subject.toLowerCase().includes(searchQuery) ||
          t.code.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      filtered.forEach(tmpl => {
        const item = document.createElement("button");
        item.className = `template-item ${tmpl.id === currentTemplate.id ? 'active' : ''}`;
        
        let badgeClass = "badge-trial";
        if (tmpl.category === "BILLING") badgeClass = "badge-billing";
        if (tmpl.category === "FINANCE") badgeClass = "badge-finance";
        if (tmpl.category === "BUDGET") badgeClass = "badge-budget";
        if (tmpl.category === "AUTOMATE") badgeClass = "badge-automate";
        if (tmpl.category === "AI") badgeClass = "badge-ai";
        if (tmpl.category === "PROD") badgeClass = "badge-prod";
        if (tmpl.category === "SECURITY") badgeClass = "badge-security";

        item.innerHTML = `
          <div class="template-item-top">
            <span class="badge ${badgeClass}">${tmpl.category}</span>
            <span class="template-item-code">${tmpl.code}</span>
          </div>
          <div class="template-item-title">${tmpl.title}</div>
        `;

        item.onclick = () => {
          currentTemplate = tmpl;
          renderList();
          renderPreview();
        };

        listEl.appendChild(item);
      });
    }

    function renderPreview() {
      const subject = interpolate(currentTemplate.subject, MOCK_VARS);
      document.getElementById("previewSubject").textContent = subject;
      document.getElementById("previewCode").textContent = currentTemplate.code;
      document.getElementById("previewRecipient").textContent = currentTemplate.recipient;
      document.getElementById("previewTrigger").textContent = currentTemplate.trigger;

      const container = document.getElementById("emailContainer");
      const categoryTag = `${currentTemplate.category} • NORA STUDIO`;

      // Monta o template com Header Dinâmico + Conteúdo Específico + Rodapé Padrão
      const fullHtml = `
        <div class="em-wrap">
          ${getStandardHeader(MOCK_VARS, categoryTag)}
          ${interpolate(currentTemplate.html, MOCK_VARS)}
          ${getStandardFooter(MOCK_VARS)}
        </div>
      `;

      container.innerHTML = fullHtml;
    }

    function setThemeMode(mode) {
      const body = document.body;
      const btnLight = document.getElementById("btnThemeLight");
      const btnDark = document.getElementById("btnThemeDark");

      if (mode === "dark") {
        body.classList.add("em-dark-theme");
        btnDark.classList.add("active");
        btnLight.classList.remove("active");
        isDarkTheme = true;
      } else {
        body.classList.remove("em-dark-theme");
        btnLight.classList.add("active");
        btnDark.classList.remove("active");
        isDarkTheme = false;
      }
    }

    function setViewMode(mode) {
      const container = document.getElementById("emailContainer");
      const btnDesk = document.getElementById("btnDesktop");
      const btnMob = document.getElementById("btnMobile");

      if (mode === "mobile") {
        container.className = "email-frame-container frame-mobile";
        btnDesk.classList.remove("active");
        btnMob.classList.add("active");
      } else {
        container.className = "email-frame-container frame-desktop";
        btnMob.classList.remove("active");
        btnDesk.classList.add("active");
      }
    }

    // Filtros por Categoria
    document.getElementById("categoryFilter").addEventListener("click", (e) => {
      if (e.target.classList.contains("cat-btn")) {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentCategory = e.target.getAttribute("data-cat");
        renderList();
      }
    });

    // Pesquisa
    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderList();
    });

    // Início
    renderList();
    renderPreview();
  </script>
